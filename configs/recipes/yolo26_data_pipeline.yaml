schema_version: recipe_bundle.v1
recipes:
  - kind: atomic
    recipe_id: yolo26_small_object_weighted_sampling
    version: v1.0.0
    target_error_facts: [{fact_type: area_metric, area: small}, {fact_type: false_negative, object_size: small}]
    target_metrics: [ap_small, recall, map50_95]
    component_ids: [sampling.small_object_weighted]
    train_overrides: {imgsz: 640, profile: pilot}
    data_actions: [small_object_weighted_sampling]
    fixed_variables: {imgsz: 640, val_split: unchanged, test_split: unchanged}
    primary_changed_variable: data.small_object_weighted_sampling
    compatibility_requirements: [normalized_xywh_labels, train_split_only]
    conflicts: [validation_resampling, automatic_imgsz_increase]
    evidence_prior: [{evidence_level: paper_claim, note: component_adaptation_not_exact_reproduction}]
    stop_conditions: [ap_small_not_improved, overall_map_guard_regressed]
    promotion_requirements: [exposure_manifest, matched_pilot, paired_delta]
    maturity: adapter_implemented
