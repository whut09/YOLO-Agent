schema_version: recipe_bundle.v1
recipes:
  - kind: atomic
    recipe_id: yolo26_generic_multi_scale_fusion
    version: v1.0.0
    target_error_facts: [{fact_type: scale_variation}, {fact_type: area_metric}]
    target_metrics: [map50_95, ap_small, ap_medium, ap_large]
    component_ids: [neck.multi_scale_fusion]
    train_overrides: {imgsz: 640, profile: pilot, neck_plugin: multi_scale_fusion}
    data_actions: []
    inference_actions: []
    fixed_variables: {imgsz: 640, detection_head: native_yolo26, bbox_regression: native_dfl_free, inference_path: native_nms_free}
    primary_changed_variable: model_graph.neck_plugin
    compatibility_requirements: [yolo26_p3_p4_p5_contract, matched_pilot]
    conflicts: [automatic_imgsz_increase, p2_head, another_neck_plugin]
    expected_effects: {scale_balance: improve}
    evidence_prior: []
    implementation_risk: medium
    training_cost: {vram_guard: hard, parameter_guard: hard}
    inference_cost: {latency_guard: hard, model_size_guard: hard}
    stop_conditions: [target_error_not_improved, latency_guard_regressed, vram_guard_regressed, parameter_guard_regressed, model_size_guard_regressed]
    promotion_requirements: [shape_backward_amp_export, partial_checkpoint_audit, matched_pilot, latency_guard, vram_guard, parameter_guard, model_size_guard]
    maturity: adapter_implemented

