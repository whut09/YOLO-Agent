schema_version: recipe_bundle.v1
recipes:
  - kind: atomic
    recipe_id: yolo26_tood_tal_assignment_shadow
    version: v1.0.0
    target_error_facts: [{fact_type: confidence_localization_mismatch}, {fact_type: localization_heavy_class}, {fact_type: assignment_conflict}]
    target_metrics: [assignment_positive_ratio, assignment_conflict_rate, confidence_iou_correlation]
    component_ids: [assigner.task_aligned]
    train_overrides: {imgsz: 640, profile: debug, assignment.one_to_many.tood_tal.mode: shadow, assignment.maximum_assignment_latency_ms: 250.0, assignment.maximum_incremental_memory_mb: 1024.0}
    data_actions: []
    inference_actions: []
    fixed_variables: {imgsz: 640, assignment_path: one_to_many, one_to_one_path: native, bbox_regression: native_dfl_free, head: native, inference_graph: unchanged}
    primary_changed_variable: assignment.one_to_many.tood_tal.mode
    compatibility_requirements: [point_based_candidates, native_assignment_baseline, shadow_evidence_gate, matched_control]
    conflicts: [anchor_based_assigner, one_to_one_replacement, head_replacement, bbox_loss_replacement, automatic_imgsz_increase]
    expected_effects: {assignment_alignment: observe_only}
    evidence_prior: [{paper_id: arxiv:2108.07755, evidence_level: paper_prior, reported_delta: {}, local_evidence: false, exact_reproduction: false}]
    implementation_risk: medium
    training_cost: {shadow_assignment_overhead: measured}
    inference_cost: {latency_change: none, model_size_change: none}
    stop_conditions: [shadow_output_invalid, assignment_conflict_rate_exceeded, latency_guard_regressed, model_size_guard_regressed]
    promotion_requirements: [minimum_shadow_batches, native_loss_equivalence, positive_assignment_valid, explicit_active_pilot, latency_guard, model_size_guard]
    maturity: adapter_implemented

