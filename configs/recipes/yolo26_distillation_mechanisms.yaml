    paper_specific_mechanism_id: feature_distillation
    paper_specific_configuration: {branch_id: feature_distillation, loss_mode: feature_distillation, teacher_signal: intermediate_feature_tensor_list}
    required_evidence: [frozen_teacher, teacher_checkpoint_sha256, validated_feature_hooks, teacher_student_same_split, student_only_export]
    primary_changed_variable: loss.distillation.feature.weight
    compatibility_requirements: *compatibility
    conflicts: *conflicts
    expected_effects: {ap_small: improve, representation_gap: reduce}
    evidence_prior: [{paper_id: method-profile:feature-distillation, evidence_level: paper_prior, reported_delta: {}, local_evidence: false, exact_reproduction: false}]
    implementation_risk: medium
    training_cost: *single_teacher_cost
    inference_cost: *unchanged_inference
    stop_conditions: *stops
    promotion_requirements: [validated_feature_hooks, runtime_single_batch, zero_weight_equivalence, matched_pilot]
    maturity: adapter_implemented

