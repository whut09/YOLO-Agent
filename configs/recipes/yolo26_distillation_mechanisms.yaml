  - kind: coupled
    recipe_id: yolo26_logits_feature_distillation
    version: v1.0.0
    target_error_facts: [{fact_type: class_low_ap}, {fact_type: representation_gap}]
    target_metrics: [map50_95, recall, per_class_ap]
    component_ids: [distillation.logits, distillation.feature]
    train_overrides: {imgsz: 640, profile: pilot}
    fixed_variables: {imgsz: 640, student: yolo26n.pt, teacher: yolo26s.pt, shared_augmentation_geometry: true, student_inference_graph: unchanged}
    primary_changed_variable: loss.distillation.logits.weight
    coupled_variables: [loss.distillation.logits.weight, loss.distillation.feature.weight]
    coupling_reason: Teacher output distributions supervise final responses while intermediate feature energy supervises representation; attribution requires both atomic arms before the combined arm.
    coupling_source_papers: [method-profile:logits-distillation, method-profile:feature-distillation]
    internal_ablation_plan:
      - {name: baseline, components: [], changed_variables: {}}
      - {name: logits, components: [distillation.logits], changed_variables: {loss.distillation.logits.weight: 1.0}}
      - {name: feature, components: [distillation.feature], changed_variables: {loss.distillation.feature.weight: 1.0}}
      - {name: logits_feature, components: [distillation.logits, distillation.feature], changed_variables: {loss.distillation.logits.weight: 1.0, loss.distillation.feature.weight: 1.0}}
    compatibility_requirements: *compatibility
    conflicts: *conflicts
    expected_effects: {map50_95: improve, representation_gap: reduce}
    evidence_prior: [{evidence_level: paper_prior, local_evidence: false, exact_reproduction: false}]
    implementation_risk: high
    training_cost: *single_teacher_cost
    inference_cost: *unchanged_inference
    stop_conditions: *stops
    promotion_requirements: [baseline_a_b_a_plus_b_ablation, matched_pilot, target_error_improvement]
    maturity: adapter_implemented

