schema_version: recipe_bundle.v1
recipes:
  - kind: atomic
    recipe_id: yolo26_logits_distillation
    version: v1.0.0
    target_error_facts: [{fact_type: class_low_ap}, {fact_type: class_confusion}]
    target_metrics: [map50_95, recall, per_class_ap]
    component_ids: [distillation.logits]
    train_overrides: {imgsz: 640, profile: pilot, loss.distillation.logits.weight: 1.0}
    fixed_variables: {imgsz: 640, student: yolo26n.pt, teacher: yolo26s.pt, shared_augmentation_geometry: true, student_inference_graph: unchanged}
    paper_specific_mechanism_id: logits_distillation
    paper_specific_configuration: {branch_id: logits_distillation, loss_mode: logits_distillation, teacher_signal: response_logits_tensor}
    required_evidence: [frozen_teacher, teacher_checkpoint_sha256, teacher_student_same_split, student_only_export]
    primary_changed_variable: loss.distillation.logits.weight
    compatibility_requirements: &compatibility [same_dataset_split, local_teacher_checkpoint, matched_pilot]
    conflicts: &conflicts [automatic_imgsz_increase, student_graph_replacement, unfrozen_teacher]
    expected_effects: {map50_95: improve, class_confusion: reduce}
    evidence_prior: [{paper_id: method-profile:logits-distillation, evidence_level: paper_prior, reported_delta: {}, local_evidence: false, exact_reproduction: false}]
    implementation_risk: low
    training_cost: &single_teacher_cost {teacher_forward: required, gpu_memory: increased}
    inference_cost: &unchanged_inference {latency_change: none, model_size_change: none}
    stop_conditions: &stops [pilot_target_error_not_improved, training_instability, memory_budget_exceeded]
    promotion_requirements: &promotion [runtime_single_batch, zero_weight_equivalence, matched_pilot, target_error_improvement]
    maturity: adapter_implemented

