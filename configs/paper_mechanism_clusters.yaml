schema_version: paper_mechanism_clusters.v1
clusters:
  - cluster_id: sampling_class_balancing
    display_name: Sampling and class balancing
    training_semantic: weighted_training_data_exposure
    adapter_family: data.sampling
    canonical_component_ids: [sampling.small_object]
    method_families: [sampling, long_tail_learning]
    semantic_aliases: [class balancing, rare class sampling, image reweighting]
    insertion_points: [train_dataloader_sampler, training_data]
    required_runtime_hooks: [build_train_dataset, build_train_dataloader]
    parameter_keys: [data.sampling_policy, max_oversampling_ratio, class_balance_weight]
    training_only: true
    inference_changed: false
    yolo26_compatibility: compatible
    constraints: [validation_and_test_sampling_unchanged]
  - cluster_id: small_object_weighted_sampling
