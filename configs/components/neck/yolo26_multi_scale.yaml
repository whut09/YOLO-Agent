    checkpoint_compatibility: partial_load_graph_extension
    training_only: false
    inference_only: false
    changes_model_graph: true
    affects_latency: hard_guarded
    affects_model_size: hard_guarded
    supports_amp: true
    supports_ddp: true
    supports_onnx: true
    supports_tensorrt: unknown
    fixed_imgsz_compatible: true
    maturity: adapter_implemented
    tests_required: [mock_graph, shape, backward, amp, export_dry_run, partial_checkpoint_audit, latency_guard, vram_guard, parameter_guard, model_size_guard]
    known_risks: [adaptation_not_exact_paper_reproduction, resize_bandwidth, gate_saturation, latency_regression, activation_memory_regression]

