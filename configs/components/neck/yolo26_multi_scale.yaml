components:
  neck.multi_scale_fusion:
    schema_version: component_contract.v1
    display_name: YOLO26 Generic Multi-scale Fusion Neck
    category: neck
    implementation_path: yolo_agent.components.adapters.neck.multi_scale_adapter
    adapter_class: MultiScaleFusionAdapter
    changed_variable: model.neck_plugin
    paper_specific_mechanism_ids: [neck.multi_scale_fusion]
    runtime_payload_schema: {model_graph_plugin: {neck_kind: multi_scale_fusion, imgsz: 640}}
    evidence_protocol: [shape, forward, backward, export_dry_run, resource_guards, matched_control, imgsz_640]
    insertion_point: before_detect_p3_p4_p5
    supported_detector_families: [yolo26]
    supported_model_patterns: [yolo26n.pt]
    supported_heads: [one_to_one]
    tensor_input_contract: {strides: [8, 16, 32], channels: runtime_audited, compatibility_constraints: {requires_dfl: false, preserves_native_one_to_one: true}}
    tensor_output_contract: {strides: [8, 16, 32], channels: unchanged}
    checkpoint_compatibility: partial_load_graph_extension
    training_only: false
    inference_only: false
    changes_model_graph: true
    affects_latency: hard_guarded
    affects_model_size: hard_guarded
    supports_amp: true
    supports_ddp: true
    supports_onnx: true
    supports_tensorrt: unknown
    fixed_imgsz_compatible: true
    maturity: adapter_implemented
    tests_required: [mock_graph, shape, backward, amp, export_dry_run, partial_checkpoint_audit, latency_guard, vram_guard, parameter_guard, model_size_guard]
    known_risks: [latency_regression, activation_memory_regression]

