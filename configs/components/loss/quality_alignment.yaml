components:
  loss.quality.correlation:
    schema_version: component_contract.v1
    display_name: Correlation Quality Alignment Loss
    category: classification_loss
    source_papers: [arxiv:2301.01019]
    implementation_path: yolo_agent.components.adapters.losses.quality_alignment
    adapter_class: QualityAlignmentAuxiliaryLossAdapter
    insertion_point: trainer_loss
    supported_detector_families: [yolo26]
    supported_model_patterns: [yolo26n.pt]
    supported_heads: [one_to_one]
    tensor_input_contract: {native_task_aligned_matches: true, one2many_scores: true}
    tensor_output_contract: {additive_scalar_auxiliary_loss: true}
    checkpoint_compatibility: unchanged_graph
    training_only: true
    inference_only: false
    changes_model_graph: false
    affects_latency: training_only
    affects_model_size: none
    supports_amp: true
    supports_ddp: true
    supports_onnx: true
    supports_tensorrt: true
    fixed_imgsz_compatible: true
    maturity: adapter_implemented
    tests_required: [shape, backward, amp, zero_weight, batch_log, checkpoint_metadata]
    known_risks: [few_positive_matches, low_iou_variance]

