components:
  inference.sahi_slicing:
    schema_version: component_contract.v1
    display_name: SAHI Slicing Inference
    category: slicing
    implementation_path: yolo_agent.components.adapters.inference.slicing
    adapter_class: SlicingInferenceAdapter
    changed_variable: inference.slicing_policy
    paper_specific_mechanism_ids: [inference.sahi_slicing]
    runtime_payload_schema: {inference_plugin: {policy: sahi_slicing, imgsz: 640}}
    evidence_protocol: [sliced_metrics, standard_metrics_preserved, imgsz_640]
    insertion_point: inference_protocol
    supported_detector_families: [yolo26]
    supported_model_patterns: [yolo26n.pt]
    supported_heads: [one_to_one]
    checkpoint_compatibility: unchanged_checkpoint
    training_only: false
    inference_only: true
    changes_model_graph: false
    affects_latency: hard_guarded
    affects_model_size: none
    supports_amp: true
    supports_ddp: true
    supports_onnx: unknown
    supports_tensorrt: unknown
    fixed_imgsz_compatible: true
    maturity: adapter_implemented
    tests_required: [optional_dependency, mock_backend, coco_eval, namespace_isolation, nms_policy, latency_guard]
    known_risks: [cross_slice_duplicates_without_merge, latency_regression, optional_sahi_dependency]
