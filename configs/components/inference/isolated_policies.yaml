components:
  inference.tiled_multi_scale:
    schema_version: component_contract.v1
    display_name: Tiled Multi-scale Inference
    category: inference_policy
    implementation_path: yolo_agent.components.adapters.inference.plugin
    adapter_class: TiledMultiScaleInferenceAdapter
    insertion_point: inference_protocol
    supported_detector_families: [yolo26]
    supported_model_patterns: [yolo26n.pt, yolo26s.pt, yolo26m.pt]
    supported_heads: [one_to_one]
    checkpoint_compatibility: unchanged_checkpoint
    training_only: false
    inference_only: true
    changes_model_graph: false
    affects_latency: hard_guarded
    affects_model_size: none
    supports_amp: unknown
    supports_ddp: false
    supports_onnx: unknown
    supports_tensorrt: unknown
    fixed_imgsz_compatible: true
    maturity: adapter_implemented
    tests_required: [mock_backend, tile_coordinates, namespace_isolation, merge_policy, latency_guard]
    known_risks: [latency_regression, cross_tile_duplicates, memory_pressure]

  inference.test_time_augmentation:
