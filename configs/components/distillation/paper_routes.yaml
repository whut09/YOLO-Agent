components:
  distillation.general_instance:
    schema_version: component_contract.v1
    display_name: Paper distillation route (Dai_General_Instance_Distillation_for_Object_Detection)
    category: distillation
    implementation_family: distillation.paper_route
    paper_specific_mechanism_ids:
    - distillation.general_instance
    source_papers:
    - cvf:cvpr2021:Dai_General_Instance_Distillation_for_Object_Detection
    implementation_path: yolo_agent.components.adapters.distillation.paper_routes
    adapter_class: DistillationGeneralInstanceAdapter
    changed_variable: distillation.method
    insertion_point: intermediate_feature_relations
    supported_detector_families:
    - yolo26
    supported_model_patterns:
    - yolo26n.pt
    supported_heads:
    - one_to_one
    tensor_input_contract:
      teacher_checkpoint_frozen: true
      teacher_student_same_dataset: true
      imgsz: 640
    tensor_output_contract:
      student_supervised_plus_distillation_loss: true
      final_checkpoint_student_only: true
    runtime_payload_schema:
      branch_id: str
      mechanism: str
      loss_mode: relation_distillation
      teacher: path
      student: path
      teacher_sha256: sha256
      student_sha256: sha256
      teacher_architecture: str
      student_architecture: yolo26n
      teacher_split: str
      student_split: str
      imgsz: '640'
      weight: float
      teacher_signal: intermediate_feature_tensor_list
      student_signal: intermediate_feature_tensor_list
      paper_id: str
      method_profile_id: str
      paper_specific_mechanism_id: str
      recipe_id: str
      paper_route_fingerprint: sha256
      teacher_imgsz: '640'
      student_imgsz: '640'
      dataset_hash: sha256
      matched_baseline: object
      student_only_export: 'true'
      student_only_metrics: latency_ms,model_size_mb
    evidence_protocol:
    - paper_route_fingerprint
    - teacher_checkpoint
    - teacher_checkpoint_sha256
    - teacher_student_same_split
    - student_only_evaluation
    - distillation_branch:relation_distillation
    checkpoint_compatibility: unchanged_graph
    training_only: true
    inference_only: false
    changes_model_graph: false
    affects_latency: training_only
    affects_model_size: none
    supports_amp: true
    supports_ddp: true
    supports_onnx: true
    supports_tensorrt: true
    fixed_imgsz_compatible: true
    maturity: recipe_idea_only
    tests_required:
    - paper_route_identity
    - teacher_resolution
    - checkpoint_hash
    - dataset_split
    - student_only_export
    - matched_baseline
    known_risks:
    - teacher_checkpoint_missing
    - teacher_student_feature_alignment
