components:
  domain_adaptation.adversarial_feature_alignment:
    schema_version: component_contract.v1
    display_name: Adversarial Feature Alignment
    category: domain_adaptation
    implementation_family: domain_adaptation.adversarial
    paper_specific_mechanism_ids: [adversarial_feature_alignment]
    implementation_path: yolo_agent.components.adapters.domain_adaptation.branch_runtime
    adapter_class: DomainAdaptationBranchAdapter
    insertion_point: trainer_loss
    supported_detector_families: [yolo26]
    supported_heads: [one_to_one]
    tensor_input_contract: {explicit_source_target_domain_ids: true}
    tensor_output_contract: {additive_domain_alignment_loss: true}
    runtime_payload_schema: {source_features: tensor_list, target_features: tensor_list}
    evidence_protocol: [source_target_split, explicit_domain_ids, matched_control]
    checkpoint_compatibility: unchanged_graph
    training_only: true
    changes_model_graph: false
    fixed_imgsz_compatible: true
    maturity: adapter_implemented

