components:
  assigner.task_aligned:
    schema_version: component_contract.v1
    display_name: YOLO26 TOOD Task-Aligned Assignment
    category: assigner
    source_papers: [arxiv:2108.07755]
    implementation_path: yolo_agent.components.adapters.assigners.yolo26_assignment
    adapter_class: YOLO26AssignmentAdapter
    changed_variable: assignment.one_to_many.tood_tal.mode
    paper_specific_mechanism_ids: [assigner.task_aligned]
    runtime_payload_schema: {assigner_plugin: {method: tood_tal, mode: shadow, imgsz: 640}}
    evidence_protocol: [native_assignment_audit, shadow_equivalence, positive_assignment, matched_control, imgsz_640]
    insertion_point: one_to_many_assignment
    supported_detector_families: [yolo26]
    supported_model_patterns: [yolo26n.pt]
    supported_heads: [one_to_one]
    tensor_input_contract:
      anchor_representation: point
      assignment_path: one_to_many
      default_mode: shadow
      compatibility_constraints: {anchor_based: false, requires_anchors: false}
    tensor_output_contract: {native_five_tensor_assignment: true, active_requires_shadow_evidence: true}
    checkpoint_compatibility: unchanged_graph
    training_only: true
    inference_only: false
    changes_model_graph: false
    affects_latency: training_only
    affects_model_size: none
    supports_amp: true
    supports_ddp: true
    supports_onnx: true
    supports_tensorrt: true
    fixed_imgsz_compatible: true
    maturity: adapter_implemented
    tests_required: [native_audit, shadow_equivalence, assignment_shape, activation_gate]
    known_risks: [tal_only_not_full_tood, conflict_rate_shift, active_requires_new_pilot]

