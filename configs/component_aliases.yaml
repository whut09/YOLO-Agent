schema_version: component_aliases.v1
canonical_components:
  - canonical_component_id: attention.deformable
    category: attention
    aliases: [deformable_attention, deformable-attention]
    semantic_aliases: [deformable attention module]
    detector_families: [transformer_detector, one_stage]
    target_error_types: [scale_variation, spatial_misalignment]
    target_metrics: [map50_95, ap_small]
    insertion_point: feature_attention
    yolo26_compatibility: adapter_required
    mapping_reason: Curated alias for deformable spatial attention components.
  - canonical_component_id: feature_pyramid.multi_scale
    category: feature_pyramid
    aliases: [multi_scale_features, multi-scale-features]
    semantic_aliases: [multi scale feature fusion]
    detector_families: [generic]
    target_error_types: [scale_variation, small_object_false_negative]
    target_metrics: [map50_95, ap_small, ap_medium, ap_large]
    insertion_point: neck_feature_pyramid
    yolo26_compatibility: adapter_required
    mapping_reason: Multi-scale feature aggregation belongs to the feature-pyramid taxonomy.
  - canonical_component_id: neck.multi_scale_fusion
    category: neck
    aliases: [multi_scale_fusion, generic_multi_scale_fusion, bidirectional_multi_scale_fusion, cross_scale_fusion]
    semantic_aliases: [guarded multi scale neck fusion]
    detector_families: [yolo26]
    target_error_types: [scale_variation, small_object_false_negative]
    target_metrics: [map50_95, ap_small, ap_medium, ap_large]
    insertion_point: before_detect_p3_p4_p5
    yolo26_compatibility: compatible
    mapping_reason: Generic or cross-scale feature fusion maps to the local shape-preserving YOLO26 neck plugin, not to a complete source detector.
  - canonical_component_id: neck.gold_gather_distribute
    category: neck
    aliases: [gather_distribute_neck, gold_yolo_gather_distribute]
    semantic_aliases: [gold yolo gather and distribute neck]
    detector_families: [yolo, yolo26]
    target_error_types: [scale_variation, cross_scale_information_decay]
    target_metrics: [map50_95, ap_small, ap_medium, ap_large]
    insertion_point: before_detect_p3_p4_p5
    yolo26_compatibility: compatible
    mapping_reason: Gold-YOLO gather-distribute maps to an isolated local adaptation, not the complete detector.
  - canonical_component_id: neck.rtmdet_large_kernel
    category: neck
    aliases: [large_kernel_depthwise_conv, rtmdet_large_kernel_neck]
    semantic_aliases: [rtmdet 5x5 depthwise neck]
    detector_families: [one_stage, yolo26]
    target_error_types: [scale_variation, limited_receptive_field]
    target_metrics: [map50_95, ap_medium, ap_large]
    insertion_point: before_detect_p3_p4_p5
    yolo26_compatibility: compatible
    mapping_reason: RTMDet large-kernel prior maps only to isolated 5x5 depthwise neck blocks.
  - canonical_component_id: detection_head.dynamic
    category: detection_head
    aliases: [dynamic_head, dynamic-head]
    semantic_aliases: [dynamic detection head]
    detector_families: [one_stage, two_stage]
    target_error_types: [scale_variation, feature_selection]
    target_metrics: [map50_95]
    insertion_point: detection_head
    yolo26_compatibility: adapter_required
    mapping_reason: Dynamic head changes feature selection or prediction-head behavior.
  - canonical_component_id: head.p2_small_object
    category: detection_head
    aliases: [p2_head, p2_small_object_head]
    semantic_aliases: [high resolution p2 detection head]
    detector_families: [yolo26]
    target_error_types: [small_object_false_negative, stride_resolution_limit]
    target_metrics: [ap_small, map50_95]
    insertion_point: feature_pyramid_p2
    yolo26_compatibility: adapter_required
    mapping_reason: P2 small-object heads map to the audited YOLO26 graph adapter when available.
  - canonical_component_id: detection_head.learnable_proposals
    category: detection_head
    aliases: [learnable_proposals, learnable-proposals]
    semantic_aliases: [learned object queries]
    detector_families: [transformer_detector]
    target_error_types: [proposal_recall, duplicate_prediction]
    target_metrics: [map50_95, recall]
    insertion_point: query_or_proposal_initialization
    yolo26_compatibility: incompatible
    mapping_reason: Learnable proposals are detector-family head/query concepts, not YOLO26 adapters.
  - canonical_component_id: matching.hybrid
    category: matching
    aliases: [hybrid_matching, hybrid-matching]
    semantic_aliases: [hybrid assignment matching]
    detector_families: [transformer_detector, nms_free]
    target_error_types: [assignment_instability, duplicate_prediction]
    target_metrics: [map50_95, recall]
    insertion_point: target_matching
    yolo26_compatibility: adapter_required
    mapping_reason: Hybrid matching changes how predictions are paired with targets.
  - canonical_component_id: assigner.task_aligned
    category: assigner
    aliases: [task_aligned_assignment, task-aligned-assignment, task_aligned_assigner]
    semantic_aliases: [task aligned assigner]
    detector_families: [one_stage, yolo26]
    target_error_types: [positive_sample_quality, classification_localization_misalignment]
    target_metrics: [map50_95, recall]
    insertion_point: one_to_many_assignment
    yolo26_compatibility: compatible
    mapping_reason: Task-aligned assignment maps to the guarded YOLO26 TOOD-TAL shadow adapter; active use still requires shadow evidence.
  - canonical_component_id: assigner.optimal_transport
    category: assigner
    aliases: [optimal_transport_assigner, ota_assignment]
    semantic_aliases: [optimal transport assignment]
    detector_families: [one_stage, yolo26]
    target_error_types: [assignment_conflict, duplicate_prediction, crowded_scene]
    target_metrics: [assignment_conflict_rate, recall, map50_95]
    insertion_point: one_to_many_assignment
    yolo26_compatibility: compatible
    mapping_reason: OTA maps to an independent point-based Sinkhorn shadow implementation with an evidence-gated active path.
  - canonical_component_id: assigner.dynamic_smooth_label
    category: assigner
    aliases: [dynamic_smooth_labels, dynamic_smooth_label_assigner, dsla]
    semantic_aliases: [dynamic smooth label assignment]
    detector_families: [one_stage, yolo26]
    target_error_types: [assignment_boundary_instability, small_object_false_negative, confidence_localization_mismatch]
    target_metrics: [assignment_conflict_rate, ap_small, map50_95]
    insertion_point: one_to_many_assignment
    yolo26_compatibility: compatible
    mapping_reason: DSLA maps to an independent smooth-target shadow implementation adapted to YOLO26 point candidates.
  - canonical_component_id: quality_estimation.iou_aware_classification
    category: quality_estimation
    aliases: [IoU_aware_classification, iou_aware_classification]
    semantic_aliases: [localization aware classification score]
    detector_families: [generic]
    target_error_types: [score_localization_misalignment, ranking_error]
    target_metrics: [map50_95, precision]
    insertion_point: classification_quality_branch
    yolo26_compatibility: adapter_required
    mapping_reason: IoU-aware classification estimates localization quality in the class score.
  - canonical_component_id: quality_alignment.general
    category: quality_estimation
    aliases: [classification_localization, quality_estimation, mutual_supervision]
    semantic_aliases: [classification localization alignment]
    detector_families: [generic, one_stage]
    target_error_types: [confidence_localization_mismatch, ranking_error]
    target_metrics: [map50_95, ap75, precision]
    insertion_point: classification_and_localization_training_objectives
    yolo26_compatibility: adapter_required
    mapping_reason: Generic classification-localization alignment is a method family and does not imply a specific local auxiliary-loss implementation.
  - canonical_component_id: detection_head.task_aligned
    category: detection_head
    aliases: [task_aligned_head]
    semantic_aliases: [task aligned detection head]
    detector_families: [one_stage]
    target_error_types: [classification_localization_misalignment]
    target_metrics: [map50_95, ap75]
    insertion_point: detection_head
    yolo26_compatibility: adapter_required
    mapping_reason: A task-aligned head is distinct from task-aligned assignment and needs an independent YOLO26 graph adapter.
  - canonical_component_id: loss.quality.correlation
    category: classification_loss
    aliases: [correlation_loss, quality_alignment]
    semantic_aliases: [classification localization correlation loss]
    detector_families: [yolo26]
    target_error_types: [localization_heavy, confidence_localization_mismatch]
    target_metrics: [map50_95, ap75]
    insertion_point: trainer_loss
    yolo26_compatibility: compatible
    mapping_reason: Correlation Loss maps to the additive YOLO26 quality-alignment loss adapter.
  - canonical_component_id: loss.calibration.bpc
    category: calibration
    aliases: [confidence_calibration, train_time_loss, bpc_calibration]
    semantic_aliases: [bridging precision and confidence]
    detector_families: [yolo26]
    target_error_types: [high_confidence_false_positive, confidence_localization_mismatch]
    target_metrics: [precision, detection_calibration_error]
    insertion_point: trainer_loss
    yolo26_compatibility: compatible
    mapping_reason: BPC maps to a training-only confidence calibration auxiliary loss.
  - canonical_component_id: loss.quality.pseudo_iou
    category: quality_estimation
    aliases: [pseudo_iou, pseudo-iou]
    semantic_aliases: [pseudo iou quality target]
    detector_families: [yolo26]
    target_error_types: [localization_heavy, positive_sample_quality]
    target_metrics: [map50_95, ap75]
    insertion_point: trainer_loss
    yolo26_compatibility: compatible
    mapping_reason: Pseudo-IoU is conservatively adapted as an auxiliary quality target without replacing the native assigner.
  - canonical_component_id: augmentation.denoising
    category: augmentation
    aliases: [denoising, denoising_training]
    semantic_aliases: [query denoising training]
    detector_families: [transformer_detector]
    target_error_types: [matching_instability, slow_convergence]
    target_metrics: [map50_95]
    insertion_point: training_targets
    yolo26_compatibility: incompatible
    mapping_reason: Query denoising is primarily a transformer-detector training recipe.
  - canonical_component_id: feature_pyramid.standard
    category: feature_pyramid
    aliases: [feature_pyramid, feature-pyramid, fpn]
    semantic_aliases: [pyramid feature fusion]
    detector_families: [generic]
    target_error_types: [scale_variation]
    target_metrics: [map50_95, ap_small]
    insertion_point: neck_feature_pyramid
    yolo26_compatibility: adapter_required
    mapping_reason: Generic feature-pyramid concepts require an explicit model-graph adapter.
  - canonical_component_id: sampling.small_object
    category: sampling
    aliases: [small_object_sampling, small-object-sampling]
    semantic_aliases: [small object oversampling]
    detector_families: [yolo26]
    target_error_types: [small_object_false_negative, class_imbalance]
    target_metrics: [ap_small, recall]
    insertion_point: train_dataloader_sampler
    yolo26_compatibility: adapter_required
    mapping_reason: Small-object sampling maps to the local sampler contract when that contract is present.
  - canonical_component_id: inference.sahi_slicing
    category: slicing
    aliases: [slicing, sahi, slicing_inference, sliced_inference, high_resolution_tiling, overlap_merge]
    semantic_aliases: [tiled inference, slicing aided hyper inference]
    detector_families: [generic]
    target_error_types: [small_object_false_negative]
    target_metrics: [sliced_map50_95, sliced_ap_small, sliced_latency_ms]
    insertion_point: inference_policy
    yolo26_compatibility: compatible
    mapping_reason: SAHI slicing, high-resolution tiling, and overlap merge map to the isolated inference adapter and remain separate from standard 640 metrics.
  - canonical_component_id: distillation.yolo26_teacher_student
    category: distillation
    aliases: [distillation, teacher_student_distillation, localization_distillation, feature_distillation, logits_distillation]
    semantic_aliases: [knowledge distillation, teacher student knowledge distillation]
    detector_families: [yolo26]
    target_error_types: [capacity_gap, representation_quality]
    target_metrics: [map50_95, ap_small]
    insertion_point: trainer_loss
    yolo26_compatibility: compatible
    mapping_reason: Distillation maps to the audited YOLO26 teacher-student runtime loss adapter.
  - canonical_component_id: distillation.vision_language
    category: distillation
    aliases: [vision_language_distillation, visual_linguistic_distillation, visual_linguistic_knowledge]
    semantic_aliases: [visual linguistic knowledge distillation]
    detector_families: [open_vocabulary_detector, vision_language_detector]
    target_error_types: [unseen_class_recall, vocabulary_shift]
    target_metrics: [map50_95, recall]
    insertion_point: vision_language_teacher_and_classifier
    yolo26_compatibility: incompatible
    mapping_reason: Vision-language distillation changes teacher modalities or classifier semantics and is not the local YOLO26 teacher-student adapter.
  - canonical_component_id: distillation.cross_modal
    category: distillation
    aliases: [cross_modality_distillation, multimodal_knowledge_distillation]
    semantic_aliases: [cross modality knowledge distillation, distilling multimodal knowledge]
    detector_families: [multimodal_detector]
    target_error_types: [modality_gap]
    target_metrics: [map50_95, recall]
    insertion_point: multimodal_teacher_and_features
    yolo26_compatibility: incompatible
    mapping_reason: Cross-modal distillation requires modality-specific inputs and remains outside the single-modality YOLO26 adapter.
  - canonical_component_id: domain_adaptation.general
    category: domain_adaptation
    aliases: [domain_adaptation, domain-adaptation]
    semantic_aliases: [unsupervised domain adaptive detection]
    detector_families: [generic]
    target_error_types: [domain_shift]
    target_metrics: [map50_95, recall]
    insertion_point: training_data_and_features
    yolo26_compatibility: adapter_required
    mapping_reason: Domain adaptation is a broad recipe family requiring a concrete adaptation method.
  - canonical_component_id: detection_head.open_vocabulary
    category: detection_head
    aliases: [open_vocabulary_detection, open-vocabulary-detection]
    semantic_aliases: [open vocabulary object detection]
    detector_families: [open_vocabulary_detector]
    target_error_types: [unseen_class_recall, vocabulary_shift]
    target_metrics: [map50_95, recall]
    insertion_point: classifier_and_text_encoder
    yolo26_compatibility: incompatible
    mapping_reason: Open-vocabulary detection changes the classifier and detector family.
compound_aliases:
  - aliases: [small_object_multiscale_recipe]
    semantic_aliases: [small object multi scale pipeline]
    canonical_component_ids: [feature_pyramid.multi_scale, sampling.small_object]
    split_reason: The paper term combines feature aggregation and data sampling, which require separate ablations.
