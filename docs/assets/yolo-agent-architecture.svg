  <text x="937" y="383" text-anchor="middle" class="panel-title" fill="#0f766e">Evidence-driven Decision Core / 证据驱动决策核心</text>

  <g>
    <rect x="551" y="414" width="220" height="74" rx="7" class="box" stroke="#2dd4bf"/>
    <circle cx="582" cy="441" r="15" fill="#ccfbf1" stroke="#0f766e"/>
    <path d="M575 441 h14 M582 434 v14" stroke="#0f766e" stroke-width="2"/>
