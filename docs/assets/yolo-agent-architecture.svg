    <text x="665" y="462" text-anchor="middle" class="box-sub">symptom → likely cause</text>

    <rect x="803" y="414" width="220" height="74" rx="7" class="box" stroke="#2dd4bf"/>
    <circle cx="834" cy="441" r="15" fill="#ccfbf1" stroke="#0f766e"/>
    <path d="M828 434 q6 -5 12 0 v10 q-6 6 -12 0 z" fill="none" stroke="#0f766e" stroke-width="2"/>
    <text x="917" y="442" text-anchor="middle" class="box-title">Decision Bundle</text>
    <text x="917" y="462" text-anchor="middle" class="box-sub">LLM or rule proposals only</text>

    <rect x="1055" y="414" width="268" height="74" rx="7" class="box" stroke="#2dd4bf"/>
    <circle cx="1086" cy="441" r="15" fill="#ccfbf1" stroke="#0f766e"/>
    <path d="M1079 441 l5 5 9 -11" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <text x="1193" y="442" text-anchor="middle" class="box-title">Recipe Critic &amp; Eligibility</text>
    <text x="1193" y="462" text-anchor="middle" class="box-sub">evidence, adapter, compatibility</text>

    <path d="M771 451 H798" class="arrow-teal"/>
    <path d="M1023 451 H1050" class="arrow-teal"/>

    <rect x="551" y="531" width="220" height="74" rx="7" class="box" stroke="#2dd4bf"/>
    <text x="661" y="558" text-anchor="middle" class="box-title">Utility &amp; Budget</text>
    <text x="661" y="579" text-anchor="middle" class="box-sub">gain, confidence, cost, risk</text>

    <rect x="803" y="531" width="220" height="74" rx="7" class="box" stroke="#2dd4bf"/>
    <text x="913" y="558" text-anchor="middle" class="box-title">Ablation &amp; Diversity</text>
    <text x="913" y="579" text-anchor="middle" class="box-sub">atomic, coupled, cooldown</text>

    <rect x="1055" y="531" width="268" height="74" rx="7" class="box" stroke="#2dd4bf"/>
    <text x="1189" y="558" text-anchor="middle" class="box-title">RoundExecutionPlan + ASHA</text>
    <text x="1189" y="579" text-anchor="middle" class="box-sub">single budget authority</text>

    <path d="M1193 488 V516 H661 V526" class="arrow-teal"/>
    <path d="M771 568 H798" class="arrow-teal"/>
    <path d="M1023 568 H1050" class="arrow-teal"/>
  </g>
  <path d="M495 500 H520" class="arrow-teal"/>
  <text x="507" y="489" text-anchor="middle" class="flow-label">context</text>

  <!-- Governance rail -->
  <rect x="1380" y="354" width="180" height="491" rx="8" class="panel" stroke="#ea580c" fill="#fff7ed"/>
  <text x="1470" y="383" text-anchor="middle" class="panel-title" fill="#c2410c">Guardrails</text>
  <text x="1470" y="403" text-anchor="middle" class="box-sub">确定性治理</text>
  <g>
    <rect x="1398" y="425" width="144" height="54" rx="6" class="box" stroke="#fb923c"/>
    <text x="1470" y="447" text-anchor="middle" class="box-title">Compatibility</text>
    <text x="1470" y="465" text-anchor="middle" class="micro">YOLO26 contracts</text>

    <rect x="1398" y="494" width="144" height="54" rx="6" class="box" stroke="#fb923c"/>
    <text x="1470" y="516" text-anchor="middle" class="box-title">Maturity</text>
    <text x="1470" y="534" text-anchor="middle" class="micro">smoke-passed minimum</text>

    <rect x="1398" y="563" width="144" height="54" rx="6" class="box" stroke="#fb923c"/>
    <text x="1470" y="585" text-anchor="middle" class="box-title">Evidence</text>
    <text x="1470" y="603" text-anchor="middle" class="micro">current + matched only</text>

    <rect x="1398" y="632" width="144" height="54" rx="6" class="box" stroke="#fb923c"/>
    <text x="1470" y="654" text-anchor="middle" class="box-title">Fixed Variables</text>
    <text x="1470" y="672" text-anchor="middle" class="micro">imgsz=640</text>

    <rect x="1398" y="701" width="144" height="54" rx="6" class="box" stroke="#fb923c"/>
    <text x="1470" y="723" text-anchor="middle" class="box-title">Budget &amp; Stop</text>
    <text x="1470" y="741" text-anchor="middle" class="micro">GPU hours, patience</text>

    <rect x="1398" y="770" width="144" height="54" rx="6" class="box" stroke="#fb923c"/>
    <text x="1470" y="792" text-anchor="middle" class="box-title">Full Consent</text>
    <text x="1470" y="810" text-anchor="middle" class="micro">explicit confirmation</text>
  </g>
  <path d="M1380 500 H1355" class="arrow-blue"/>
  <path d="M1380 568 H1355" class="arrow-blue"/>

  <!-- Execution -->
  <path d="M1189 605 V676" class="arrow-teal"/>
  <text x="1204" y="648" class="flow-label">assign</text>
  <rect x="525" y="676" width="825" height="169" rx="8" class="panel" stroke="#0f766e" fill="#f0fdfa"/>
  <text x="937" y="705" text-anchor="middle" class="panel-title" fill="#0f766e">Guarded Execution and Evaluation / 受控执行与评估</text>
  <g>
    <rect x="552" y="734" width="220" height="78" rx="7" class="box" stroke="#2dd4bf"/>
    <text x="662" y="762" text-anchor="middle" class="box-title">ExecutionQueue</text>
    <text x="662" y="782" text-anchor="middle" class="box-sub">recoverable, consume once</text>

    <rect x="804" y="734" width="220" height="78" rx="7" class="box" stroke="#2dd4bf"/>
    <text x="914" y="762" text-anchor="middle" class="box-title">Ultralytics + Adapters</text>
    <text x="914" y="782" text-anchor="middle" class="box-sub">train, patch, profile, artifacts</text>

    <rect x="1056" y="734" width="268" height="78" rx="7" class="box" stroke="#2dd4bf"/>
    <text x="1190" y="762" text-anchor="middle" class="box-title">COCO Post-eval</text>
    <text x="1190" y="782" text-anchor="middle" class="box-sub">predictions, facts, bootstrap</text>

    <path d="M772 773 H799" class="arrow-teal"/>
    <path d="M1024 773 H1051" class="arrow-teal"/>
  </g>

  <!-- Evidence outputs -->
  <rect x="215" y="676" width="280" height="169" rx="8" class="panel" stroke="#7c3aed" fill="#faf5ff"/>
  <text x="355" y="705" text-anchor="middle" class="panel-title" fill="#7c3aed">Verified Outcomes</text>
  <text x="355" y="724" text-anchor="middle" class="box-sub">本地验证结果</text>
  <g>
    <rect x="239" y="742" width="105" height="38" rx="6" class="box" stroke="#c4b5fd"/>
    <text x="291" y="765" text-anchor="middle" class="small">Paired Δ</text>
    <rect x="362" y="742" width="105" height="38" rx="6" class="box" stroke="#c4b5fd"/>
    <text x="414" y="765" text-anchor="middle" class="small">Error Δ</text>
    <rect x="239" y="791" width="105" height="38" rx="6" class="box" stroke="#c4b5fd"/>
    <text x="291" y="814" text-anchor="middle" class="small">Latency</text>
    <rect x="362" y="791" width="105" height="38" rx="6" class="box" stroke="#c4b5fd"/>
    <text x="414" y="814" text-anchor="middle" class="small">Model Size</text>
  </g>
  <path d="M1056 823 C890 875 620 875 495 804" class="arrow-purple"/>
  <text x="758" y="866" text-anchor="middle" class="flow-label">verified local evidence</text>

  <!-- Persistence -->
  <path d="M355 845 V916" class="arrow-purple"/>
  <path d="M937 845 V916" class="arrow-purple"/>
  <rect x="215" y="918" width="1135" height="111" rx="8" class="panel" stroke="#7c3aed" fill="#faf5ff"/>
  <text x="782" y="946" text-anchor="middle" class="panel-title" fill="#7c3aed">Persistent Run State, Audit, and Learning / 持久化、审计与学习</text>
  <g>
    <rect x="244" y="966" width="194" height="44" rx="7" class="box" stroke="#c4b5fd"/>
    <text x="341" y="993" text-anchor="middle" class="box-title">RunContext &amp; Lineage</text>
    <rect x="458" y="966" width="194" height="44" rx="7" class="box" stroke="#c4b5fd"/>
    <text x="555" y="993" text-anchor="middle" class="box-title">Events &amp; Ledger</text>
    <rect x="672" y="966" width="194" height="44" rx="7" class="box" stroke="#c4b5fd"/>
    <text x="769" y="993" text-anchor="middle" class="box-title">Queue &amp; ASHA State</text>
    <rect x="886" y="966" width="194" height="44" rx="7" class="box" stroke="#c4b5fd"/>
    <text x="983" y="993" text-anchor="middle" class="box-title">Artifacts &amp; Reports</text>
    <rect x="1100" y="966" width="220" height="44" rx="7" class="box" stroke="#c4b5fd"/>
    <text x="1210" y="993" text-anchor="middle" class="box-title">Policy &amp; Reproduction</text>
  </g>

  <!-- Closed-loop feedback -->
  <path d="M1210 1029 V1062 H150 V500 H210" class="arrow-purple arrow-dashed"/>
  <text x="770" y="1088" text-anchor="middle" class="panel-title" fill="#7c3aed">Diagnose → Propose → Gate → Execute → Verify → Learn → Repeat</text>
  <text x="770" y="1108" text-anchor="middle" class="micro">Paper claims guide exploration; only matched local evidence changes promotion and memory.</text>
</svg>
