schema_version: 1
document: docs/architecture.md
review_policy: When the tracked Python file set of any area changes, docs/architecture.md
  must be reviewed by a human and the snapshot regenerated with `python -m yolo_agent.tools.architecture_sources
  --update`. The consistency test fails with an "architecture review required" message
  until then. This tool never writes architecture content; it only detects that a
  review is due.
areas:
  cli:
    description: CLI entry, command registry, and handler wiring
    paths:
    - yolo_agent/cli.py
  task:
    description: Task specification and round-decision schemas
    paths:
    - yolo_agent/core/task_spec.py
    - yolo_agent/core/schemas.py
    - yolo_agent/core/error_round_decision.py
  evidence:
    description: Error profiles, deltas, pilot evidence, and paired statistics
    paths:
    - yolo_agent/core/detection_error_profile.py
    - yolo_agent/core/detection_error_profile_builder.py
    - yolo_agent/core/detection_error_delta.py
    - yolo_agent/core/pilot_evidence.py
    - yolo_agent/core/paired_bootstrap.py
  action_space:
    description: Action families, runtime phases, and execution classes
    paths:
    - yolo_agent/agents/action_space_schemas.py
  runtime:
    description: Ultralytics adapter surface and component adapters
    paths:
    - yolo_agent/adapters/ultralytics
    - yolo_agent/components/adapters
  experiment:
    description: Optimization loop, ASHA scheduling, and run orchestration
    paths:
    - yolo_agent/agents/auto_optimization_loop.py
    - yolo_agent/agents/asha_scheduler.py
    - yolo_agent/agents/optimize_runner.py
    - yolo_agent/agents/orchestrator.py
    - yolo_agent/agents/error_driven_loop.py
  research:
    description: Paper intelligence, coverage, and readiness research modules
    paths:
    - yolo_agent/research
  release:
    description: Training release, acceptance, and runtime preflight
    paths:
    - yolo_agent/research/training_release.py
    - yolo_agent/research/pretraining_acceptance.py
    - yolo_agent/research/paper_runtime_preflight.py
    - yolo_agent/core/paper_implementation_gate.py
